services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      PAPERPULSE_DATA_DIR: /app/data
      PAPERPULSE_FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped
